# Papo — produção. Segredos vêm do .env (fora do Git). Gere com ops/gen-secrets.sh.
name: papo

x-api-env: &api-env
  ENV: production
  DATABASE_URL: postgresql+asyncpg://papo_app:${PAPO_APP_PASSWORD}@postgres:5432/papo
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  OIDC_ISSUER: ${AUTH_URL:-https://${AUTH_DOMAIN}}/realms/papo
  OIDC_AUDIENCE: papo-api
  OIDC_JWKS_URL: http://keycloak:8080${KC_HTTP_RELATIVE_PATH:-}/realms/papo/protocol/openid-connect/certs
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: papo
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
  SECRETS_KEY: ${SECRETS_KEY}                  # cifra a chave da IA cadastrada no painel
  HUBGW_URL: http://hubgw:8200
  HUBGW_TOKEN: ${HUBGW_TOKEN}
  KC_INTERNAL_URL: http://keycloak:8080${KC_HTTP_RELATIVE_PATH:-}
  KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:-}
  MODEL_QUICK: ${MODEL_QUICK:-claude-haiku-4-5-20251001}
  MODEL_DEFAULT: ${MODEL_DEFAULT:-claude-sonnet-5-5}
  MODEL_COMPLEX: ${MODEL_COMPLEX:-claude-opus-5-5}
  MODEL_ROUTER: ${MODEL_ROUTER:-claude-haiku-4-5-20251001}
  DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-2000000}
  MESSAGES_PER_MINUTE: ${MESSAGES_PER_MINUTE:-20}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  traefik:
    image: traefik:v3.3.2
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.middlewares=security-headers@file
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=300s
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=papo_edge
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --accesslog=true
      - --accesslog.fields.headers.defaultmode=drop
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    networks: [edge]
    logging: *logging

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PAPO_OWNER_PASSWORD: ${PAPO_OWNER_PASSWORD}
      PAPO_APP_PASSWORD: ${PAPO_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/10-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d papo"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [data]
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    networks: [data]
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    logging: *logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5   # ≥ 26.7.2 (CVE-2026-18963); migra o banco do Keycloak sozinho na subida
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${AUTH_URL:-https://${AUTH_DOMAIN}}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/}
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /          # healthcheck em :9000/health mesmo com o Keycloak num subcaminho
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./infra/keycloak/papo-realm.json:/opt/keycloak/data/import/papo-realm.json:ro
      - ./infra/keycloak/themes/papo:/opt/keycloak/themes/papo:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`${AUTH_DOMAIN}`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.services.auth.loadbalancer.server.port=8080
      # console de administração só a partir das redes autorizadas
      - traefik.http.routers.auth-admin.rule=Host(`${AUTH_DOMAIN}`) && PathPrefix(`/admin`)
      - traefik.http.routers.auth-admin.entrypoints=websecure
      - traefik.http.routers.auth-admin.middlewares=admin-allow
      - traefik.http.routers.auth-admin.service=auth
      - traefik.http.middlewares.admin-allow.ipallowlist.sourcerange=${ADMIN_IP_ALLOWLIST:-127.0.0.1/32}
    networks: [edge, data]
    logging: *logging

  migrate:
    build: ./api
    image: papo-api:${PAPO_VERSION:-1.0.0}
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://papo_owner:${PAPO_OWNER_PASSWORD}@postgres:5432/papo
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [data]

  api:
    image: papo-api:${PAPO_VERSION:-1.0.0}
    restart: unless-stopped
    environment: *api-env
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=8000
    networks: [edge, data]
    logging: *logging

  worker:
    image: papo-api:${PAPO_VERSION:-1.0.0}
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *api-env
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [data, egress]          # egress: único serviço que sai para a API da Anthropic
    logging: *logging

  # Gateway de leitura dos Docs do hub: único serviço que alcança as fontes (pastas :ro desta VPS, leitor da outra VPS, SFTP).
  # Só lê e devolve bytes em memória para a API e o worker; nada é gravado.
  hubgw:
    image: papo-api:${PAPO_VERSION:-1.0.0}
    restart: unless-stopped
    command: ["uvicorn", "app.hubgw:app", "--host", "0.0.0.0", "--port", "8200", "--no-server-header", "--workers", "1"]
    environment:
      <<: *api-env
      HUBGW_LOCAL_ROOTS: ${HUBGW_LOCAL_ROOTS:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/healthz',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data, egress]
    logging: *logging

  web:
    build: ./web
    image: papo-web:${PAPO_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      AUTH_URL: ${AUTH_URL:-https://${AUTH_DOMAIN}}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.priority=10
      - traefik.http.services.web.loadbalancer.server.port=8080
    networks: [edge]
    logging: *logging

networks:
  edge: { name: papo_edge }
  data: { name: papo_data, internal: true }    # banco, Redis e MinIO sem saída para a internet
  egress: { name: papo_egress }

volumes:
  pgdata:
  redisdata:
  miniodata:
  letsencrypt:
